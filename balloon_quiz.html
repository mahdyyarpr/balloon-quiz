<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>بادکنک‌های دانایی | بازی درسی ششم</title>

:root{--ink:#192342;--pink:#ff6b9b;--blue:#54b8ff;--yellow:#ffd766;--mint:#59dfc0;--purple:#a78bfa;--bg:#f2f6ff}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#f6f8ff,#e9f5ff);color:var(--ink);min-height:100vh;overflow-x:hidden}.app{max-width:920px;margin:auto;padding:18px 14px 30px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.logo{font-size:22px;font-weight:900}.logo small{font-size:12px;display:block;color:#68718e;font-weight:600}.pill{background:#fff;padding:8px 13px;border-radius:30px;font-weight:800;box-shadow:0 5px 16px #24345a0b}.panel{background:#fff;border-radius:26px;box-shadow:0 16px 40px #425e9a12;padding:22px;border:1px solid #e8edfa}.hero{text-align:center;padding:24px 8px 20px}.hero h1{font-size:clamp(25px,5vw,42px);margin:8px 0 4px;font-weight:900}.hero p{margin:0;color:#65718c}.bubble{display:inline-block;background:#fff5c9;color:#7d5b00;padding:8px 14px;border-radius:20px;font-weight:800;font-size:13px}.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.field label{display:block;font-weight:800;margin:0 0 7px}.field select{width:100%;font:inherit;border:2px solid #e6ebf7;background:#f8faff;border-radius:14px;padding:12px;color:var(--ink);outline:none}.field select:focus{border-color:#7ebdff}.speed-row{display:flex;gap:9px}.speed{flex:1;border:2px solid #e7ecf8;background:#f9fbff;padding:11px 7px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer}.speed.active{background:#eaf6ff;border-color:#65baff;color:#1275bb}.start{border:0;background:linear-gradient(90deg,#ff6b9b,#ff8e75);color:#fff;border-radius:16px;font:inherit;font-weight:900;font-size:18px;padding:15px 22px;width:100%;margin-top:18px;box-shadow:0 9px 20px #ff6b9b35;cursor:pointer}.start:active{transform:scale(.99)}.footer-note{text-align:center;color:#8791a8;font-size:12px;margin-top:14px}.screen{display:none}.screen.show{display:block}.gamehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#f3f7ff;padding:8px 12px;border-radius:12px;font-weight:800}.timer-wrap{height:10px;background:#e9effb;border-radius:20px;overflow:hidden;margin:16px 0}.timerbar{height:100%;width:100%;background:linear-gradient(90deg,#5bcbff,#9c88ff);transition:width .1s linear}.qtext{font-size:clamp(18px,4vw,25px);font-weight:900;text-align:center;min-height:70px;display:flex;align-items:center;justify-content:center;padding:6px}.balloon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;min-height:260px;margin-top:10px}.answer{position:relative;border:0;border-radius:28px 28px 30px 30px;color:#182345;min-height:112px;padding:16px 14px;font:inherit;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 10px 0 #0000000c;transition:transform .16s,filter .16s;overflow:hidden}.answer:before{content:'';width:13px;height:13px;position:absolute;bottom:-5px;left:50%;transform:rotate(45deg);background:inherit}.answer:hover{transform:translateY(-5px);filter:saturate(1.1)}.answer:nth-child(1){background:#ffb8d0}.answer:nth-child(2){background:#a9dcff}.answer:nth-child(3){background:#ffe48d}.answer:nth-child(4){background:#b8f1de}.answer.correct{outline:4px solid #22b985;filter:saturate(1.2)}.answer.wrong{outline:4px solid #fa5c68;opacity:.75}.answer:disabled{cursor:default}.feedback{text-align:center;font-weight:900;min-height:27px;margin-top:8px}.nextbtn{display:none;margin:12px auto 0;border:0;border-radius:14px;padding:12px 25px;background:#27375f;color:white;font:inherit;font-weight:900;cursor:pointer}.exit{border:0;border-radius:12px;background:#f1f4fb;padding:9px 13px;font:inherit;font-weight:800;cursor:pointer}.result{text-align:center}.scorebig{font-size:52px;font-weight:900;color:#5b8cff;margin:8px}.results-msg{font-weight:800;font-size:18px}.review{text-align:right;margin-top:18px}.reviewitem{padding:12px;border-radius:13px;background:#f5f8ff;margin:9px 0;font-size:14px}.reviewitem strong{display:block;margin-bottom:5px}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}.again{background:#54b8ff!important}.hidden{display:none!important}

</style></head><body><main class="app">\n<div class="top"><div class="logo">🎈 بادکنک‌های دانایی<small>بازی پرسش و پاسخ پایه ششم</small></div><div class="pill">📚 کلاس ششم</div></div>
<section id="home" class="screen show"><div class="panel"><div class="hero"><span class="bubble">یاد بگیر، بترکون! 🎉</span><h1>آماده‌ی یک چالش درسی؟</h1><p>درس و فصل رو انتخاب کن، سرعت رو تنظیم کن و ۱۰ سؤال جواب بده.</p></div>
<div class="setup"><div class="field"><label for="subject">📖 انتخاب درس</label><select id="subject"><option value="mix">همه درس‌ها (ترکیبی)</option><option value="math">ریاضی</option><option value="science">علوم</option><option value="persian">فارسی</option><option value="social">مطالعات اجتماعی</option><option value=" Quran">قرآن و هدیه‌ها</option><option value="english">زبان انگلیسی</option></select></div><div class="field"><label for="chapter">🧩 انتخاب فصل / درس</label><select id="chapter"><option value="all">همه فصل‌ها</option></select></div><div class="field" style="grid-column:1/-1"><label>⏱️ سرعت بازی (زمان هر سؤال)</label><div class="speed-row"><button class="speed active" data-sec="15">آرام · ۱۵ ثانیه</button><button class="speed" data-sec="10">عادی · ۱۰ ثانیه</button><button class="speed" data-sec="7">تند · ۷ ثانیه</button></div></div></div><button class="start" id="play">▶ شروع بازی / PLAY</button><div class="footer-note">هر بازی ۱۰ سؤال دارد. هر پاسخ درست ۱۰ امتیاز 🎯</div></div></section>
<section id="game" class="screen"><div class="panel"><div class="gamehead"><div class="stats"><div class="stat" id="counter">سؤال ۱ از ۱۰</div><div class="stat" id="score">امتیاز: ۰</div></div><button class="exit" id="exit">↩ خروج / EXIT</button></div><div class="timer-wrap"><div id="timerbar" class="timerbar"></div></div><div id="qtext" class="qtext"></div><div id="answers" class="balloon-grid"></div><div id="feedback" class="feedback"></div><button id="next" class="nextbtn">سؤال بعدی ←</button></div></section>
<section id="result" class="screen"><div class="panel result"><span class="bubble">🎊 بازی تموم شد!</span><h1>نتیجه‌ی تو</h1><div id="scorebig" class="scorebig">۰٪</div><div id="resultsmsg" class="results-msg"></div><div id="resultdetails"></div><div class="actions"><button class="start again" id="again">🔄 بازی دوباره</button><button class="exit" id="resultexit">⌂ صفحه اصلی / EXIT</button></div></div></section>
</main>
<script>
const Q={
 math:[
 {c:1,q:'عدد ۴۸۰٬۰۰۰ چند برابر ۴۸ است؟',a:['۱۰۰','۱۰','۱۰۰۰','۴۸'],k:0},{c:1,q:'کدام عدد بر ۳ بخش‌پذیر است؟',a:['۴۱','۵۲','۷۲','۸۵'],k:2},{c:2,q:'محیط مربعی با ضلع ۷ سانتی‌متر چقدر است؟',a:['۱۴','۲۸','۴۹','۲۱'],k:1},{c:2,q:'۳/۴ از ۲۰ چند می‌شود؟',a:['۱۰','۱۲','۱۵','۱۶'],k:2},{c:3,q:'در یک نسبت ۲ به ۵، اگر بخش اول ۸ باشد بخش دوم چند است؟',a:['۱۰','۱۵','۲۰','۲۵'],k:2},{c:3,q:'کدام گزینه یک عدد اعشاری برابر با ۰٫۵ است؟',a:['۰٫۰۵','۵٫۰','۰٫۵۰','۰٫۰۰۵'],k:2},{c:4,q:'حجم مکعبی با ضلع ۳ واحد چند واحد مکعب است؟',a:['۹','۱۲','۲۷','۶'],k:2},{c:4,q:'زاویه راست چند درجه است؟',a:['۴۵','۹۰','۱۸۰','۳۶۰'],k:1},{c:5,q:'میانگین ۴، ۶ و ۸ کدام است؟',a:['۵','۶','۷','۸'],k:1},{c:6,q:'کسر ۲/۴ ساده‌شده برابر چیست؟',a:['۱/۲','۱/۴','۲/۳','۳/۴'],k:0}],
 science:[{c:1,q:'برای اندازه‌گیری جرم یک جسم از چه وسیله‌ای استفاده می‌کنیم؟',a:['دماسنج','ترازو','خط‌کش','زمان‌سنج'],k:1},{c:1,q:'کدام حالت ماده شکل و حجم ثابت دارد؟',a:['گاز','مایع','جامد','بخار'],k:2},{c:2,q:'کدام مورد منبع انرژی تجدیدپذیر است؟',a:['زغال‌سنگ','نفت','باد','گاز طبیعی'],k:2},{c:2,q:'در مدار ساده، چه چیزی باعث روشن شدن لامپ می‌شود؟',a:['مدار باز','مدار بسته','سیم قطع','باتری خالی'],k:1},{c:3,q:'کدام اندام گیاه بیشتر آب را جذب می‌کند؟',a:['برگ','گل','ریشه','ساقه'],k:2},{c:3,q:'تبدیل بخار آب به قطره‌های آب چه نام دارد؟',a:['تبخیر','میعان','ذوب','انجماد'],k:1},{c:4,q:'کدام جانور مهره‌دار است؟',a:['کرم خاکی','حلزون','ماهی','عنکبوت'],k:2},{c:4,q:'سیاره‌ای که به سیاره سرخ معروف است کدام است؟',a:['زهره','مریخ','مشتری','عطارد'],k:1},{c:5,q:'کدام مخلوط را می‌توان با صاف کردن جدا کرد؟',a:['آب و نمک','آب و شن','آب و شکر','آب و رنگ'],k:1},{c:6,q:'سنگ‌های رسوبی معمولاً چگونه تشکیل می‌شوند؟',a:['از سرد شدن گدازه','از ته‌نشستن و فشرده شدن رسوبات','از تبخیر فلز','از سوختن مواد'],k:1}],
 persian:[{c:1,q:'کدام گزینه هم‌معنی «کوشش» است؟',a:['تلاش','آرامش','اندوه','تردید'],k:0},{c:1,q:'«دانش‌آموزان» از نظر شمار چه نوع اسمی است؟',a:['مفرد','جمع','مصدر','صفت'],k:1},{c:2,q:'کدام واژه مخالف «آغاز» است؟',a:['شروع','ابتدا','پایان','مقدمه'],k:2},{c:2,q:'در جمله «گل زیبا شکفت»، صفت کدام است؟',a:['گل','زیبا','شکفت','جمله'],k:1},{c:3,q:'کدام گزینه یک فعل است؟',a:['کتاب','دوستی','می‌نویسد','زیبا'],k:2},{c:3,q:'«فداکاری» بیشتر به چه معناست؟',a:['خودخواهی','از خودگذشتگی','بی‌حوصلگی','ترس'],k:1},{c:4,q:'کدام نشانه برای پایان جمله پرسشی است؟',a:['.','،','؟','!'],k:2},{c:4,q:'کدام واژه درست نوشته شده است؟',a:['مسعول','مسئول','مسوولل','مسئل'],k:1},{c:5,q:'«چون» معمولاً چه رابطه‌ای را نشان می‌دهد؟',a:['علت','مکان','مالکیت','تعداد'],k:0},{c:6,q:'کدام گزینه جمع «اثر» است؟',a:['اثرها','اثران','اثرین','اثرگان'],k:0}],
 social:[{c:1,q:'نقشه برای چه کاری به ما کمک می‌کند؟',a:['پخت غذا','شناخت مکان‌ها','اندازه‌گیری وزن','نوشتن شعر'],k:1},{c:1,q:'کدام مورد از منابع طبیعی است؟',a:['پلاستیک','آب','میز','مداد'],k:1},{c:2,q:'یکی از وظایف شهروند خوب چیست؟',a:['رعایت قانون','آسیب به اموال عمومی','اسراف','بی‌توجهی به دیگران'],k:0},{c:2,q:'همکاری در گروه چه نتیجه‌ای دارد؟',a:['کار سخت‌تر','رسیدن بهتر به هدف','اختلاف بیشتر','بی‌نظمی'],k:1},{c:3,q:'قاره‌ای که ایران در آن قرار دارد کدام است؟',a:['اروپا','آفریقا','آسیا','استرالیا'],k:2},{c:3,q:'برای حفظ محیط زیست چه کاری بهتر است؟',a:['ریختن زباله','مصرف بی‌رویه آب','بازیافت','قطع درختان'],k:2},{c:4,q:'کدام وسیله به جابه‌جایی کالا کمک می‌کند؟',a:['قطار','دفتر','چراغ','قلم'],k:0},{c:4,q:'قانون به چه کمک می‌کند؟',a:['برهم زدن نظم','حفظ نظم و حقوق','زیاد کردن آلودگی','هدر دادن وقت'],k:1},{c:5,q:'کدام مورد نمونه میراث فرهنگی است؟',a:['بنای تاریخی','بطری یک‌بارمصرف','آگهی','دفتر نو'],k:0},{c:6,q:'در مصرف منابع بهتر است چه کنیم؟',a:['اسراف','صرفه‌جویی','آلوده کردن','بی‌توجهی'],k:1}],
 ' Quran':[{c:1,q:'قرآن کتاب آسمانی کدام دین است؟',a:['اسلام','زرتشتی','مسیحیت','یهودیت'],k:0},{c:1,q:'قبل از خواندن قرآن معمولاً چه می‌گوییم؟',a:['بسم الله الرحمن الرحیم','خداحافظ','صبح بخیر','آفرین'],k:0},{c:2,q:'یکی از ویژگی‌های اخلاق نیک چیست؟',a:['مهربانی','تمسخر','دروغ','بی‌احترامی'],k:0},{c:2,q:'کمک به نیازمندان چه رفتاری است؟',a:['نیکوکاری','خودخواهی','ناسپاسی','بی‌تفاوتی'],k:0},{c:3,q:'نماز چه چیزی را تقویت می‌کند؟',a:['ارتباط با خدا','غرور','اسراف','تنهایی'],k:0},{c:3,q:'راست‌گویی چه نتیجه‌ای دارد؟',a:['اعتماد','بی‌اعتمادی','ترس','آشفتگی'],k:0},{c:4,q:'احترام به پدر و مادر نمونه چیست؟',a:['اخلاق نیک','بی‌نظمی','ناسازگاری','بدرفتاری'],k:0},{c:4,q:'برای نعمت‌ها چه کاری پسندیده است؟',a:['شکرگزاری','ناسپاسی','اسراف','شکایت همیشگی'],k:0},{c:5,q:'کدام رفتار باعث دوستی می‌شود؟',a:['خوش‌رفتاری','دروغ','بدگویی','آزار'],k:0},{c:6,q:'در آموزه‌های دینی، امانت‌داری چه ارزشی دارد؟',a:['ارزشمند','بی‌اهمیت','نادرست','ناپسند'],k:0}],
 english:[{c:1,q:'What is the meaning of “teacher”?',a:['معلم','پزشک','راننده','کشاورز'],k:0},{c:1,q:'Choose the correct greeting for morning.',a:['Good night','Good morning','Goodbye','See you'],k:1},{c:2,q:'Which one is a fruit?',a:['carrot','bread','apple','rice'],k:2},{c:2,q:'What is the plural of “book”?',a:['bookes','books','bookies','book'],k:1},{c:3,q:'Choose the correct sentence.',a:['She are happy.','He am tall.','They is here.','I am ready.'],k:3},{c:3,q:'“Where” asks about…',a:['زمان','مکان','شخص','تعداد'],k:1},{c:4,q:'Which word is an animal?',a:['lion','chair','pencil','window'],k:0},{c:4,q:'Choose the opposite of “big”.',a:['tall','small','long','wide'],k:1},{c:5,q:'Which is a school subject?',a:['science','kitchen','airport','banana'],k:0},{c:6,q:'What does “How are you?” mean?',a:['چند سالته؟','کجایی؟','حالت چطوره؟','چه ساعتی؟'],k:2}]
};
const names={mix:'همه درس‌ها',math:'ریاضی',science:'علوم',persian:'فارسی',social:'مطالعات اجتماعی',' Quran':'قرآن و هدیه‌ها',english:'زبان انگلیسی'};
const chapters={math:12,science:14,persian:17,social:12,' Quran':12,english:6};
const subject=document.getElementById('subject'),chapter=document.getElementById('chapter');let speed=15,deck=[],idx=0,score=0,tick=null,remaining=0,answered=false,review=[];
function updateChapters(){let key=subject.value, max=key==='mix'?12:chapters[key]||12;chapter.innerHTML='<option value="all">همه فصل‌ها / درس‌ها</option>';for(let i=1;i<=max;i++){let o=document.createElement('option');o.value=i;o.textContent=(key==='persian'||key==='english'||key===' Quran'?'درس ':'فصل ')+i;chapter.append(o)}}
subject.addEventListener('change',updateChapters);updateChapters();document.querySelectorAll('.speed').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.speed').forEach(x=>x.classList.remove('active'));b.classList.add('active');speed=Number(b.dataset.sec)}));
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));document.getElementById(id).classList.add('show')}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function startGame(){let key=subject.value,chap=chapter.value;let selected=[];if(key==='mix'){Object.keys(Q).forEach(s=>selected.push(...Q[s].filter(q=>chap==='all'||q.c===Number(chap))))}else selected=(Q[key]||[]).filter(q=>chap==='all'||q.c===Number(chap));if(selected.length<10){selected=Q[key==='mix'?'math':key]||Q.math; if(chap!=='all')selected=selected.filter(q=>q.c===Number(chap)); if(selected.length<10){selected=(Q[key==='mix'?'math':key]||Q.math)}}deck=shuffle(selected).slice(0,10);if(deck.length<10){let extra=shuffle(Object.values(Q).flat());deck=deck.concat(extra).slice(0,10)}idx=0;score=0;review=[];showScreen('game');renderQ()}
function renderQ(){clearInterval(tick);answered=false;remaining=speed;document.getElementById('counter').textContent=`سؤال ${idx+1} از ۱۰`;document.getElementById('score').textContent=`امتیاز: ${score}`;let q=deck[idx];document.getElementById('qtext').textContent=q.q;let answers=document.getElementById('answers');answers.innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.addEventListener('click',()=>answer(i,b));answers.appendChild(b)});document.getElementById('feedback').textContent='یکی از بادکنک‌ها رو انتخاب کن!';document.getElementById('next').style.display='none';paintTimer();tick=setInterval(()=>{remaining-=.1;if(remaining<=0){remaining=0;paintTimer();answer(-1,null);return}paintTimer()},100)}
function paintTimer(){document.getElementById('timerbar').style.width=Math.max(0,remaining/speed*100)+'%'}
function answer(choice,button){if(answered)return;answered=true;clearInterval(tick);let q=deck[idx],ok=choice===q.k;if(ok)score+=10;document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q.k)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});let fb=document.getElementById('feedback');fb.textContent=choice===-1?'⏰ وقت تموم شد!':ok?'✨ آفرین! جواب درست بود +۱۰':'❌ این یکی درست نبود';review.push({q:q.q,correct:q.a[q.k],given:choice===-1?'بدون پاسخ':q.a[choice],ok});document.getElementById('score').textContent=`امتیاز: ${score}`;document.getElementById('next').style.display='block';document.getElementById('next').textContent=idx===9?'دیدن نتیجه 🏁':'سؤال بعدی ←'}
document.getElementById('next').addEventListener('click',()=>{if(!answered)return;idx++;if(idx>=10)finish();else renderQ()});
function finish(){clearInterval(tick);showScreen('result');let pct=score;document.getElementById('scorebig').textContent=pct+'٪';document.getElementById('resultsmsg').textContent=pct>=90?'عالی بود! تو ترکوندی 🎈':pct>=70?'آفرین! خیلی خوب پیش رفتی 🌟':pct>=50?'خوب بود؛ یه دور دیگه تمرین کن 💪':'ادامه بده، با تمرین بهتر می‌شی 🌱';let det=document.getElementById('resultdetails');det.innerHTML=`<div class="review"><h3>مرور پاسخ‌ها</h3>${review.map((r,i)=>`<div class="reviewitem"><strong>${i+1}. ${r.q}</strong>پاسخ درست: ${r.correct}<br>پاسخ تو: ${r.given} ${r.ok?'✓':'✗'}</div>`).join('')}</div>`}
function home(){clearInterval(tick);showScreen('home')}document.getElementById('play').addEventListener('click',startGame);document.getElementById('exit').addEventListener('click',home);document.getElementById('resultexit').addEventListener('click',home);document.getElementById('again').addEventListener('click',home);
</script></body></html>

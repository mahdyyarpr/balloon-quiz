<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بادکنک‌های دانایی | پایه ششم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(145deg,#f7f8ff,#e5f5ff);color:#192342;min-height:100vh}.app{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:22px;font-weight:900}.logo small{display:block;font-size:12px;color:#68718e}.pill,.stat{background:white;border-radius:14px;padding:9px 13px;font-weight:800}.panel{background:white;border-radius:24px;padding:22px;box-shadow:0 12px 35px #354d8215}.hero{text-align:center;padding:18px 5px}.hero h1{font-size:clamp(25px,5vw,40px);margin:8px}.hero p{color:#65718c}.bubble{display:inline-block;background:#fff2bd;padding:8px 14px;border-radius:20px;font-weight:800}.setup{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field select{width:100%;font:inherit;padding:12px;border:2px solid #e5eafa;border-radius:13px;background:#f8faff}.speedrow{display:flex;gap:8px}.speed{flex:1;border:2px solid #e5eafa;background:#f8faff;border-radius:12px;padding:10px 4px;font:inherit;font-weight:800}.speed.active{border-color:#54b8ff;background:#eaf6ff}.start{border:0;background:linear-gradient(90deg,#ff6b9b,#ff9074);color:white;border-radius:15px;padding:15px;font:inherit;font-weight:900;font-size:18px;width:100%;margin-top:18px}.screen{display:none}.screen.show{display:block}.gamehead,.stats,.actions{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap}.stat{background:#f2f6ff}.exit{border:0;background:#f1f4fb;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800}.timer{height:10px;background:#e9effb;border-radius:20px;margin:17px 0;overflow:hidden}.bar{height:100%;width:100%;background:linear-gradient(90deg,#54b8ff,#a78bfa)}.question{text-align:center;font-size:clamp(19px,4vw,26px);font-weight:900;min-height:75px;display:grid;place-items:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:12px}.answer{border:0;border-radius:28px;min-height:110px;padding:14px;font:inherit;font-weight:900;font-size:17px;box-shadow:0 8px 0 #0000000c}.answer:nth-child(1){background:#ffb8d0}.answer:nth-child(2){background:#a9dcff}.answer:nth-child(3){background:#ffe48d}.answer:nth-child(4){background:#b8f1de}.answer.correct{outline:4px solid #22b985}.answer.wrong{outline:4px solid #fa5c68;opacity:.7}.answer:disabled{opacity:.85}.feedback{text-align:center;font-weight:900;min-height:28px;margin-top:12px}.next{display:none;margin:10px auto;border:0;border-radius:13px;padding:12px 24px;background:#27375f;color:white;font:inherit;font-weight:900}.result{text-align:center}.scorebig{font-size:54px;font-weight:900;color:#5b8cff}.review{text-align:right;margin-top:18px}.reviewitem{background:#f5f8ff;border-radius:12px;padding:12px;margin:8px 0}.actions button{flex:1}.again{background:#54b8ff}.note{text-align:center;color:#8791a8;font-size:12px;margin-top:12px}@media(max-width:560px){.setup{grid-template-columns:1fr}.panel{padding:15px}.answers{gap:9px}.answer{min-height:105px;font-size:15px}}
</style></head><body><main class="app">
<div class="top"><div class="logo">🎈 بادکنک‌های دانایی<small>بازی پرسش و پاسخ پایه ششم</small></div><div class="pill">📚 کلاس ششم</div></div>
<section id="home" class="screen show"><div class="panel"><div class="hero"><span class="bubble">یاد بگیر، بترکون! 🎉</span><h1>آماده‌ی یک چالش درسی؟</h1><p>درس و فصل رو انتخاب کن، سرعت رو تنظیم کن و ۱۰ سؤال جواب بده.</p></div>
<div class="setup"><div class="field"><label>📖 انتخاب درس</label><select id="subject"><option value="mix">همه درس‌ها (ترکیبی)</option><option value="math">ریاضی</option><option value="science">علوم</option><option value="persian">فارسی</option><option value="social">مطالعات اجتماعی</option><option value="religion">قرآن و هدیه‌ها</option><option value="english">زبان انگلیسی</option></select></div><div class="field"><label>🧩 انتخاب فصل / درس</label><select id="chapter"><option value="all">همه فصل‌ها / درس‌ها</option></select></div><div class="field" style="grid-column:1/-1"><label>⏱️ زمان هر سؤال</label><div class="speedrow"><button class="speed active" data-sec="15">آرام · ۱۵ ثانیه</button><button class="speed" data-sec="10">عادی · ۱۰ ثانیه</button><button class="speed" data-sec="7">تند · ۷ ثانیه</button></div></div></div><button class="start" id="play">▶ شروع بازی / PLAY</button><div class="note">هر بازی ۱۰ سؤال دارد. هر پاسخ درست ۱۰ امتیاز 🎯</div></div></section>
<section id="game" class="screen"><div class="panel"><div class="gamehead"><div class="stats"><div class="stat" id="counter">سؤال ۱ از ۱۰</div><div class="stat" id="score">امتیاز: ۰</div></div><button class="exit" id="exit">↩ خروج / EXIT</button></div><div class="timer"><div id="bar" class="bar"></div></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><button id="next" class="next">سؤال بعدی ←</button></div></section>
<section id="result" class="screen"><div class="panel result"><span class="bubble">🎊 بازی تموم شد!</span><h1>نتیجه‌ی تو</h1><div id="scorebig" class="scorebig">۰٪</div><div id="message"></div><div id="review" class="review"></div><div class="actions"><button class="start again" id="again">🔄 بازی دوباره</button><button class="exit" id="resultexit">⌂ صفحه اصلی / EXIT</button></div></div></section></main>
<script>
const Q={
math:[{c:1,q:'عدد ۴۸۰٬۰۰۰ چند برابر ۴۸ است؟',a:['۱۰۰','۱۰','۱۰۰۰','۴۸'],k:0},{c:1,q:'کدام عدد بر ۳ بخش‌پذیر است؟',a:['۴۱','۵۲','۷۲','۸۵'],k:2},{c:2,q:'محیط مربعی با ضلع ۷ سانتی‌متر چقدر است؟',a:['۱۴','۲۸','۴۹','۲۱'],k:1},{c:2,q:'۳/۴ از ۲۰ چند می‌شود؟',a:['۱۰','۱۲','۱۵','۱۶'],k:2},{c:3,q:'در نسبت ۲ به ۵، اگر بخش اول ۸ باشد بخش دوم چند است؟',a:['۱۰','۱۵','۲۰','۲۵'],k:2},{c:3,q:'کدام عدد با ۰٫۵ برابر است؟',a:['۰٫۰۵','۵٫۰','۰٫۵۰','۰٫۰۰۵'],k:2},{c:4,q:'حجم مکعبی با ضلع ۳ چند واحد مکعب است؟',a:['۹','۱۲','۲۷','۶'],k:2},{c:4,q:'زاویه راست چند درجه است؟',a:['۴۵','۹۰','۱۸۰','۳۶۰'],k:1},{c:5,q:'میانگین ۴، ۶ و ۸ کدام است؟',a:['۵','۶','۷','۸'],k:1},{c:6,q:'کسر ۲/۴ ساده‌شده چیست؟',a:['۱/۲','۱/۴','۲/۳','۳/۴'],k:0}],
science:[{c:1,q:'برای اندازه‌گیری جرم از چه وسیله‌ای استفاده می‌کنیم؟',a:['دماسنج','ترازو','خط‌کش','زمان‌سنج'],k:1},{c:1,q:'کدام حالت ماده شکل و حجم ثابت دارد؟',a:['گاز','مایع','جامد','بخار'],k:2},{c:2,q:'کدام منبع انرژی تجدیدپذیر است؟',a:['زغال‌سنگ','نفت','باد','گاز طبیعی'],k:2},{c:2,q:'چه چیزی باعث روشن شدن لامپ در مدار ساده می‌شود؟',a:['مدار باز','مدار بسته','سیم قطع','باتری خالی'],k:1},{c:3,q:'کدام اندام گیاه بیشتر آب را جذب می‌کند؟',a:['برگ','گل','ریشه','ساقه'],k:2},{c:3,q:'تبدیل بخار آب به قطره آب چه نام دارد؟',a:['تبخیر','میعان','ذوب','انجماد'],k:1},{c:4,q:'کدام جانور مهره‌دار است؟',a:['کرم خاکی','حلزون','ماهی','عنکبوت'],k:2},{c:4,q:'سیاره سرخ کدام است؟',a:['زهره','مریخ','مشتری','عطارد'],k:1},{c:5,q:'کدام مخلوط را می‌توان با صاف کردن جدا کرد؟',a:['آب و نمک','آب و شن','آب و شکر','آب و رنگ'],k:1},{c:6,q:'سنگ رسوبی چگونه تشکیل می‌شود؟',a:['سرد شدن گدازه','ته‌نشستن و فشرده شدن رسوبات','تبخیر فلز','سوختن مواد'],k:1}],
persian:[{c:1,q:'هم‌معنی «کوشش» کدام است؟',a:['تلاش','آرامش','اندوه','تردید'],k:0},{c:1,q:'«دانش‌آموزان» از نظر شمار چه نوع اسمی است؟',a:['مفرد','جمع','مصدر','صفت'],k:1},{c:2,q:'مخالف «آغاز» کدام است؟',a:['شروع','ابتدا','پایان','مقدمه'],k:2},{c:2,q:'در جمله «گل زیبا شکفت»، صفت کدام است؟',a:['گل','زیبا','شکفت','جمله'],k:1},{c:3,q:'کدام گزینه فعل است؟',a:['کتاب','دوستی','می‌نویسد','زیبا'],k:2},{c:3,q:'«فداکاری» به چه معناست؟',a:['خودخواهی','از خودگذشتگی','بی‌حوصلگی','ترس'],k:1},{c:4,q:'نشانه پایان جمله پرسشی چیست؟',a:['.','،','؟','!'],k:2},{c:4,q:'کدام واژه درست نوشته شده است؟',a:['مسعول','مسئول','مسوولل','مسئل'],k:1},{c:5,q:'«چون» معمولاً چه رابطه‌ای را نشان می‌دهد؟',a:['علت','مکان','مالکیت','تعداد'],k:0},{c:6,q:'جمع «اثر» کدام است؟',a:['اثرها','اثران','اثرین','اثرگان'],k:0}],
social:[{c:1,q:'نقشه برای چه کاری کمک می‌کند؟',a:['پخت غذا','شناخت مکان‌ها','اندازه‌گیری وزن','نوشتن شعر'],k:1},{c:1,q:'کدام مورد از منابع طبیعی است؟',a:['پلاستیک','آب','میز','مداد'],k:1},{c:2,q:'یکی از وظایف شهروند خوب چیست؟',a:['رعایت قانون','آسیب به اموال عمومی','اسراف','بی‌توجهی'],k:0},{c:2,q:'همکاری در گروه چه نتیجه‌ای دارد؟',a:['کار سخت‌تر','رسیدن بهتر به هدف','اختلاف بیشتر','بی‌نظمی'],k:1},{c:3,q:'ایران در کدام قاره قرار دارد؟',a:['اروپا','آفریقا','آسیا','استرالیا'],k:2},{c:3,q:'برای حفظ محیط زیست چه کاری بهتر است؟',a:['ریختن زباله','مصرف بی‌رویه آب','بازیافت','قطع درختان'],k:2},{c:4,q:'کدام وسیله به جابه‌جایی کالا کمک می‌کند؟',a:['قطار','دفتر','چراغ','قلم'],k:0},{c:4,q:'قانون به چه کمک می‌کند؟',a:['برهم زدن نظم','حفظ نظم و حقوق','آلودگی','هدر دادن وقت'],k:1},{c:5,q:'کدام مورد نمونه میراث فرهنگی است؟',a:['بنای تاریخی','بطری یک‌بارمصرف','آگهی','دفتر نو'],k:0},{c:6,q:'در مصرف منابع بهتر است چه کنیم؟',a:['اسراف','صرفه‌جویی','آلوده کردن','بی‌توجهی'],k:1}],
religion:[{c:1,q:'قرآن کتاب آسمانی کدام دین است؟',a:['اسلام','زرتشتی','مسیحیت','یهودیت'],k:0},{c:1,q:'قبل از خواندن قرآن معمولاً چه می‌گوییم؟',a:['بسم الله الرحمن الرحیم','خداحافظ','صبح بخیر','آفرین'],k:0},{c:2,q:'یکی از ویژگی‌های اخلاق نیک چیست؟',a:['مهربانی','تمسخر','دروغ','بی‌احترامی'],k:0},{c:2,q:'کمک به نیازمندان چه رفتاری است؟',a:['نیکوکاری','خودخواهی','ناسپاسی','بی‌تفاوتی'],k:0},{c:3,q:'نماز چه چیزی را تقویت می‌کند؟',a:['ارتباط با خدا','غرور','اسراف','تنهایی'],k:0},{c:3,q:'راست‌گویی چه نتیجه‌ای دارد؟',a:['اعتماد','بی‌اعتمادی','ترس','آشفتگی'],k:0},{c:4,q:'احترام به پدر و مادر نمونه چیست؟',a:['اخلاق نیک','بی‌نظمی','ناسازگاری','بدرفتاری'],k:0},{c:4,q:'برای نعمت‌ها چه کاری پسندیده است؟',a:['شکرگزاری','ناسپاسی','اسراف','شکایت'],k:0},{c:5,q:'کدام رفتار باعث دوستی می‌شود؟',a:['خوش‌رفتاری','دروغ','بدگویی','آزار'],k:0},{c:6,q:'امانت‌داری چه ارزشی دارد؟',a:['ارزشمند','بی‌اهمیت','نادرست','ناپسند'],k:0}],
english:[{c:1,q:'معنی teacher چیست؟',a:['معلم','پزشک','راننده','کشاورز'],k:0},{c:1,q:'کدام سلام برای صبح است؟',a:['Good night','Good morning','Goodbye','See you'],k:1},{c:2,q:'Which one is a fruit?',a:['carrot','bread','apple','rice'],k:2},{c:2,q:'جمع book چیست؟',a:['bookes','books','bookies','book'],k:1},{c:3,q:'کدام جمله درست است؟',a:['She are happy.','He am tall.','They is here.','I am ready.'],k:3},{c:3,q:'Where درباره چه چیزی می‌پرسد؟',a:['زمان','مکان','شخص','تعداد'],k:1},{c:4,q:'Which word is an animal?',a:['lion','chair','pencil','window'],k:0},{c:4,q:'مخالف big کدام است؟',a:['tall','small','long','wide'],k:1},{c:5,q:'Which is a school subject?',a:['science','kitchen','airport','banana'],k:0},{c:6,q:'معنی How are you? چیست؟',a:['چند سالته؟','کجایی؟','حالت چطوره؟','چه ساعتی؟'],k:2}]
};
const subjects={mix:'همه درس‌ها',math:'ریاضی',science:'علوم',persian:'فارسی',social:'مطالعات اجتماعی',religion:'قرآن و هدیه‌ها',english:'زبان انگلیسی'};
const chapters={math:12,science:14,persian:17,social:12,religion:12,english:6};
const $=id=>document.getElementById(id);let speed=15,deck=[],idx=0,score=0,timer=null,remaining=0,answered=false,review=[];
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('show'));$(id).classList.add('show')}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function updateChapters(){let k=$('subject').value,n=k==='mix'?12:chapters[k];$('chapter').innerHTML='<option value="all">همه فصل‌ها / درس‌ها</option>';for(let i=1;i<=n;i++)$('chapter').add(new Option((k==='english'?'درس ':'فصل ')+i,i))}
$('subject').addEventListener('change',updateChapters);updateChapters();
document.querySelectorAll('.speed').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.speed').forEach(x=>x.classList.remove('active'));b.classList.add('active');speed=+b.dataset.sec}));
function start(){let k=$('subject').value,c=$('chapter').value,arr=[];if(k==='mix')Object.keys(Q).forEach(s=>arr.push(...Q[s].filter(q=>c==='all'||q.c===+c)));else arr=Q[k].filter(q=>c==='all'||q.c===+c);if(arr.length<10)arr=Q[k==='mix'?'math':k];deck=shuffle(arr).slice(0,10);if(deck.length<10)deck=deck.concat(shuffle(Object.values(Q).flat())).slice(0,10);idx=0;score=0;review=[];screen('game');render()}
function render(){clearInterval(timer);answered=false;remaining=speed;$('counter').textContent='سؤال '+(idx+1)+' از ۱۰';$('score').textContent='امتیاز: '+score;$('question').textContent=deck[idx].q;$('answers').innerHTML='';deck[idx].a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(i);$('answers').append(b)});$('feedback').textContent='یکی از بادکنک‌ها رو انتخاب کن!';$('next').style.display='none';paint();timer=setInterval(()=>{remaining-=.1;if(remaining<=0){remaining=0;paint();answer(-1);return}paint()},100)}
function paint(){$('bar').style.width=Math.max(0,remaining/speed*100)+'%'}
function answer(choice){if(answered)return;answered=true;clearInterval(timer);let q=deck[idx],ok=choice===q.k;if(ok)score+=10;document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q.k)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('feedback').textContent=choice===-1?'⏰ وقت تموم شد!':ok?'✨ آفرین! جواب درست بود +۱۰':'❌ این یکی درست نبود';review.push({q:q.q,correct:q.a[q.k],given:choice===-1?'بدون پاسخ':q.a[choice],ok});$('score').textContent='امتیاز: '+score;$('next').style.display='block';$('next').textContent=idx===9?'دیدن نتیجه 🏁':'سؤال بعدی ←'}
$('next').onclick=()=>{if(!answered)return;idx++;if(idx>=10)finish();else render()};
function finish(){clearInterval(timer);screen('result');$('scorebig').textContent=score+'٪';$('message').textContent=score>=90?'عالی بود! تو ترکوندی 🎈':score>=70?'آفرین! خیلی خوب پیش رفتی 🌟':score>=50?'خوب بود؛ یه دور دیگه تمرین کن 💪':'ادامه بده، با تمرین بهتر می‌شی 🌱';$('review').innerHTML='<h3>مرور پاسخ‌ها</h3>'+review.map((r,i)=>'<div class="reviewitem"><b>'+(i+1)+'. '+r.q+'</b><br>پاسخ درست: '+r.correct+'<br>پاسخ تو: '+r.given+' '+(r.ok?'✓':'✗')+'</div>').join('')}
function home(){clearInterval(timer);screen('home')}
$('play').onclick=start;$('exit').onclick=home;$('resultexit').onclick=home;$('again').onclick=home;
</script></body></html>
